name: Binder warm-up

# Pre-warm the mybinder.org image cache for the few targets people
# actually launch (see "Resolve targets" below), so the first user after
# a fresh image publish lands on a warm cache instead of waiting for a
# cold pull, which for an xl can take minutes. mybinder.org has no official warm-up API;
# we drive it via the public /build endpoint, which serves a
# text/event-stream while it builds (or simply pulls, when the stub
# branch already references a prebuilt GHCR image). Once we see
# `phase: ready` we close the connection and move on.
#
# mybinder backends evict cold images on roughly a ~6h schedule, so a
# twice-daily cadence keeps at least one backend per target warm most of the
# time.
#
# Triggered:
#   - after every main-branch run of "Build matrix" that got as far as
#     publishing (conclusion success or failure: a failed run still
#     published and re-stubbed its other targets), including its daily
#     cron. Each nightly force-pushes a fresh orphan commit to every stub
#     branch, and mybinder keys its image cache on that commit SHA, so
#     the first launch after a nightly is cold until something builds
#     it. Until 2026-10 the nightly was filtered out here in favour of
#     our own 04:00 cron, but GitHub delays both crons by ~6-7 h and
#     ours usually ran minutes *before* the new stubs were pushed
#     (2026-10-08: warm-up 11:10, stubs 11:21 UTC), leaving Binder cold
#     every morning.
#   - daily at 16:00 UTC, to re-warm after mybinder's ~6 h eviction.
#   - manual workflow_dispatch.
#
# One run at a time: a nightly-triggered run and the 16:00 one can
# overlap after GitHub's cron delays, and two concurrent sweeps would
# only double the load on mybinder.
#
# Best-effort: warm-up failures do not fail the workflow. mybinder is
# a shared community service and a flaky backend is not our problem
# to escalate.
on:
  workflow_run:
    workflows: ["Build matrix"]
    types: [completed]
    branches: [main]
  schedule:
    # The post-nightly warm comes from workflow_run above; this is the
    # second, eviction-window pass. mybinder is amd64-only, so one hit
    # per target covers every user regardless of their local arch.
    - cron: '0 16 * * *'
  # Manual trigger lets us validate this workflow without waiting for
  # the next Build matrix run on main. Useful after editing this file
  # itself (since workflow_run only fires after another workflow
  # completes — there is no way to test from a PR otherwise).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binder-warmup
  cancel-in-progress: false

jobs:
  warmup:
    # Allowed triggers:
    #  - workflow_dispatch (manual): always
    #  - schedule (our own daily cron): always
    #  - workflow_run from Build matrix: when it published (success, or
    #    failure of some targets) from push, workflow_dispatch or its
    #    daily schedule. Cancelled/skipped runs and pull_request runs
    #    (which never publish) are ignored.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      ((github.event.workflow_run.conclusion == 'success' ||
        github.event.workflow_run.conclusion == 'failure') &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'workflow_dispatch' ||
        github.event.workflow_run.event == 'schedule'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # On workflow_run, pin to the SHA whose build just finished;
          # on workflow_dispatch, github.event.workflow_run is null so
          # this resolves to empty and checkout takes its default
          # (the dispatched ref).
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve targets
        id: targets
        # Warm only what people actually launch. mybinder.org is a free
        # shared service, and until 2026-10 we warmed eight targets
        # twice a day: 598 warm-ups against 77 real launches in 30 days
        # (2.3-xl 28, 2.5-xl 26, 2.1-xl-rise 17, latest-xl 3; 2.5-small,
        # 2.4-small, 2.4-xl, latest-small and 2.1-xl none). A target
        # left out still launches, it just builds cold for its first
        # visitor on each server (xl median ~45s, tail up to ~9 min).
        #
        # Who uses what (checked with both sites, 2026-10-13):
        #   <latest>-xl  latest-xl; build-matrix pushes the latest-*
        #                stubs as the very same commit as their version
        #                branch, and mybinder caches by commit, so one
        #                warm covers both. fun-with-quantum.org links
        #                latest-xl from its home page.
        #   2.5-xl       doQumentation's default for every code cell and
        #                its Binder links (src/config/jupyter.ts). Listed
        #                explicitly so it stays warm after the next minor
        #                takes over latest.
        #   2.3-xl       a doQumentation Settings choice (its default
        #                until the 2.4/2.5 bump); 28 launches.
        #   2.1-xl-rise  every fun-with-quantum.org slideshow game.
        # Not warmed: 2.5-small, 2.4-xl (doQumentation Settings, no
        # launches), 2.1-xl (FwQ's GHZ-on-real-devices page and notebook
        # launcher, no launches), any -small, xxl and snapshot tags.
        # Neither site runs a warm-up of its own (doQumentation dropped
        # its 05:30 UTC one, 2026-10), so this is the only warmer. Revisit the
        # list against mybinder's launch stats when a site changes its
        # default.
        run: |
          set -euo pipefail
          mapfile -t all_versions < <(
            awk '/^ *ALL=\(/{f=1;next} f && /^ *\)/{exit} f' \
              .github/workflows/build-matrix.yml \
            | grep -oE "'[^']+'" \
            | tr -d "'"
          )
          latest=$(sed -nE "s/^ *LATEST_QISKIT: *'([0-9.]+)'.*/\1/p" \
            .github/workflows/build-matrix.yml)
          if [ -z "${latest}" ]; then
            echo "LATEST_QISKIT not found in build-matrix.yml." >&2
            exit 1
          fi
          wanted=("${latest}-xl" '2.5-xl' '2.3-xl' '2.1-xl-rise')
          targets=()
          for w in "${wanted[@]}"; do
            # Fail loud if a target was dropped from the matrix, so we
            # never silently warm a nonexistent (404) image.
            found=0
            for v in "${all_versions[@]}"; do
              [ "${v}" = "${w}" ] && found=1 && break
            done
            if [ "${found}" -eq 0 ]; then
              echo "Warm-up target '${w}' not found in build-matrix.yml ALL array." >&2
              echo "Was it dropped from the matrix? Update 'wanted'." >&2
              exit 1
            fi
            skip=0
            for t in "${targets[@]+"${targets[@]}"}"; do
              [ "${t}" = "${w}" ] && skip=1 && break
            done
            [ "${skip}" -eq 0 ] && targets+=("${w}")
          done
          printf 'target: %s\n' "${targets[@]}"
          {
            echo "list<<EOF"
            printf '%s\n' "${targets[@]}"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Warm mybinder cache
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME:  ${{ github.event.repository.name }}
          TARGETS:    ${{ steps.targets.outputs.list }}
        # mybinder's /build/gh/<owner>/<repo>/<ref> endpoint serves a
        # text/event-stream — but only when the client sends an
        # Accept: text/event-stream header. Without it the server
        # closes the connection without streaming any phase events at
        # all (which is what an earlier version of this workflow hit:
        # every target "succeeded" in <300ms because awk saw nothing).
        #
        # The endpoint also 307-redirects to a federation backend
        # (e.g. bids.mybinder.org). Without -L curl stops at the
        # redirect and awk sees an empty body, reporting "stream
        # ended without phase=ready" — this was the second variant
        # of the same symptom.
        #
        # We lowercase owner/repo before building the URL so the
        # request URL matches what mybinder canonicalises to (avoids
        # a stray case-sensitive hop on top of the federation one).
        #
        # We read the stream until we see `phase: ready`, then close.
        # Our stubs are `FROM <prebuilt>` so a warm or warm-ish backend
        # resolves in well under a minute. Cold backends may exceed the
        # budget, in which case we move on — partial coverage is still
        # useful.
        #
        # The budget is split by flavor because a flat 5 minutes was
        # cutting the xl tail off mid-pull. Measured over 21 runs
        # (168 target-warms, 2026-09-02..09-11):
        #
        #   flavor   confirmed  median  p90   slowest confirmed
        #   small      63/63     ~32s   ~95s     126s
        #   xl         78/105    ~43s  ~126s     275s
        #
        # No -small target timed out once; every miss was xl. And the
        # slowest confirmed xl warm landed at 275s — 25s under the cap —
        # with three more past 240s, i.e. we were truncating a
        # distribution that had not finished rather than one that had
        # stalled. The timeouts are consistent with that: they report
        # bytes still arriving (`timed out after 300002 ms with 17069
        # bytes received`), not a hung connection.
        #
        # So xl got 600s (#136), small kept 300s, which has never needed
        # more than 126s.
        #
        # 600s then proved too tight for the slowest target. 275s was the
        # slowest warm we could *see* under the 300s cap, which censored
        # the tail; with the cap lifted, 2.1-xl came in at 550s (manual
        # run, 2026-09-11), 375s (09-13) and then timed out at 600s
        # (09-14). The 09-13 run is also the clearest evidence the lift
        # works at all: 2.5-xl, 2.1-xl and 2.1-xl-rise each took 375s,
        # three warms the old cap would have discarded. Raised to 900s.
        #
        # This only extends how long we are willing to *watch*; it does
        # not make mybinder do more work. Worst case, every target timing
        # out, is 3x900s + pacing, about 45min, against a median of a
        # few minutes — fine for a twice-daily best-effort job and well
        # inside the 360min default job cap.
        #
        # 10s pacing between targets to be polite to a shared
        # community service.
        run: |
          set -euo pipefail
          owner_lc="${REPO_OWNER,,}"
          repo_lc="${REPO_NAME,,}"
          warm_one() {
            local target="$1"
            local url="https://mybinder.org/build/gh/${owner_lc}/${repo_lc}/${target}"
            # See the flavor-split budget note above. Matching on
            # *small* rather than listing versions keeps this correct as
            # the rolling window advances; everything else (xl, xl-rise,
            # and any future heavy flavor) gets the longer budget, which
            # is the safe default -- a too-long budget costs watch time
            # on a target that would have missed anyway, a too-short one
            # discards a warm that was nearly done.
            local max_time
            case "${target}" in
              *small*) max_time=300 ;;
              *)       max_time=900 ;;
            esac
            echo "::group::Warming ${target} (budget ${max_time}s)"
            echo "GET ${url}"
            local rc=0
            # awk exit codes: 0 = saw phase:ready, 2 = saw phase:failed,
            # 3 = stream ended without either (timeout, network drop,
            # or server hang-up).
            #
            # Two subtleties handled below:
            # 1. awk's `exit N` does NOT skip the END block — END runs
            #    and its own `exit` overrides. So we record the outcome
            #    in `matched` and let END consult it. (Earlier version
            #    `exit 0` then unconditional `exit 3` in END made every
            #    successful warm-up report rc=3.)
            # 2. With `set -o pipefail`, the pipeline's rc would be
            #    curl's, not awk's — awk closes the pipe on match,
            #    sending SIGPIPE to curl which then exits 23 ("Failure
            #    writing output"). We want awk's code, not curl's, so
            #    we read PIPESTATUS[1] directly.
            # We need awk's exit code (0/2/3), not the pipeline's.
            # With `pipefail` the pipeline picks the rightmost
            # non-zero, but curl gets SIGPIPE'd to rc=23 when awk
            # closes the pipe on match, masking awk's 0. Drop
            # pipefail locally so the pipeline's rc is just awk's,
            # and use an if/else so the rc is captured cleanly
            # without `|| true` clobbering PIPESTATUS.
            #
            # Note: with awk closing the pipe early, curl prints
            # "curl: (23) Failure writing output to destination" to
            # stderr — that's expected and not an error condition.
            set +o pipefail
            if curl -sSL -N --max-time "${max_time}" \
                  -H 'Accept: text/event-stream' \
                  "${url}" \
                | awk '
                    { print }
                    /"phase": *"ready"/  { matched = 0; exit }
                    /"phase": *"failed"/ { matched = 2; exit }
                    END                  { exit (matched == "" ? 3 : matched) }
                  '; then
              rc=0
            else
              rc=$?
            fi
            set -o pipefail
            echo "::endgroup::"
            case "${rc}" in
              0) echo "::notice::${target} reached phase=ready" ;;
              2) echo "::warning::${target} reported phase=failed" ;;
              3) echo "::warning::${target} stream ended without phase=ready (timeout or no events)" ;;
              *) echo "::warning::${target} warm-up exited rc=${rc}" ;;
            esac
            return "${rc}"
          }
          fail=0
          total=0
          first=1
          while IFS= read -r target; do
            [ -z "${target}" ] && continue
            total=$((total + 1))
            if [ "${first}" -eq 0 ]; then
              echo "Sleeping 10s before next target..."
              sleep 10
            fi
            first=0
            warm_one "${target}" || fail=$((fail + 1))
          done <<< "${TARGETS}"
          echo "Warmed $((total - fail))/${total} targets."
          # Best-effort: never fail the workflow on warm-up issues.
          exit 0
