name: Prune GHCR versions

# Garbage-collect GHCR container versions that nothing points at.
#
# Every nightly Build matrix run republishes all 17 flavors and mints
# ~144 brand-new versions (see the header of
# .github/scripts/prune-ghcr-versions.py for the full accounting).
# Nothing has ever pruned them, so the package grows without bound —
# which is what trips build-admin-stats.py's paging guard and silently
# drops the GHCR half of the admin page.
#
# Manual runs are DRY RUN BY DEFAULT: deleting registry versions is
# irreversible, so `apply` has to be turned on deliberately per run.
# The daily cron below is the exception — it applies, because that is
# the whole point of a scheduled GC.
#
# The schedule was added only after the one-off cleanup proved the
# candidate set is what we expect: six applied passes on 2026-09-13/14
# took the package from 17026 versions to ~470 with every live tag and
# all 84 of their child manifests still resolving at each step. Without
# a cron the growth simply comes back — 470 -> 1102 in the four days
# after that cleanup, ~158/night, which crosses the 5000-version mark
# that breaks build-admin-stats.py's paging in about three weeks.
#
# A daily pass has only ~150 candidates, far below the ~7000/hour
# deletion cap, so it should finish in one run. If it ever cannot, the
# script exits non-zero and the scheduled run shows up as failed rather
# than silently doing half the job (#141).
#
# GitHub caps deletions at roughly 7000/hour and answers the cap with
# 403. The script waits a limit out, bounded by --wait-budget, and
# exits non-zero with the remainder if it cannot finish. Raising
# wait_budget past the reset interval (~3600s) lets a single run sit
# through the window and continue rather than needing to be
# re-dispatched by hand -- at the cost of a job that mostly sleeps.
#
# The script does NOT use the usual "delete untagged versions" recipe,
# which would break these images: the image and provenance manifests
# inside today's live per-arch index are untagged. It walks the
# registry from every live tag and keeps whatever is reachable. See
# the script's SAFETY RAILS section.

on:
  # 12:00 UTC: clear of the nightly Build matrix publish window and of
  # the 04:00/16:00 warm-up slots, so a prune never races a publish.
  # (Racing one would be safe anyway — the grace window protects
  # anything newer than 3 days — but staying clear keeps logs readable.)
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Actually delete (unchecked = dry run)'
        type: boolean
        default: false
      grace_days:
        description: 'Never delete versions younger than this many days'
        type: string
        default: '3'
      limit:
        description: 'Cap deletions this run (0 = no cap)'
        type: string
        default: '0'
      max_delete:
        description: 'Refuse the run if more than this many candidates'
        type: string
        default: '20000'
      wait_budget:
        description: 'Seconds this run may spend waiting out rate limits'
        type: string
        default: '600'

permissions:
  contents: read
  # `packages: write` is what allows DELETE on a package version.
  # A dry run only needs read, but the job is one workflow either way
  # and the script will not delete without --apply.
  packages: write

# Never let two prunes overlap: the second would walk a registry the
# first is actively mutating.
concurrency:
  group: prune-ghcr
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Prune
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `inputs.*` is empty on a schedule event, so every value needs
          # a fallback here rather than relying on the input defaults
          # above (those only apply to workflow_dispatch). The scheduled
          # run is the applying one, and it gets a wait budget large
          # enough to sit through a rate-limit reset (~3600s) instead of
          # the 600s a manual run defaults to.
          GRACE='${{ inputs.grace_days  || '3' }}'
          LIMIT='${{ inputs.limit       || '0' }}'
          MAXDEL='${{ inputs.max_delete || '20000' }}'
          WAIT='${{ inputs.wait_budget  || '3000' }}'
          APPLY='${{ github.event_name == 'schedule' && 'true' || inputs.apply }}'
          echo "event=${{ github.event_name }} apply=${APPLY} grace_days=${GRACE} limit=${LIMIT} max_delete=${MAXDEL} wait_budget=${WAIT}"
          args=(
            --grace-days  "${GRACE}"
            --limit       "${LIMIT}"
            --max-delete  "${MAXDEL}"
            --wait-budget "${WAIT}"
          )
          if [ "${APPLY}" = "true" ]; then
            echo "::warning::Running with --apply: versions will be DELETED."
            args+=(--apply)
          else
            echo "Dry run (no --apply); nothing will be deleted."
          fi
          python3 .github/scripts/prune-ghcr-versions.py "${args[@]}"
